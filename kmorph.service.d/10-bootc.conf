[Service]
# kmorph.service assumes a dnf/apt host: it rebuilds the successor image
# with kmorph-mkimage --if-stale and points the config at
# /boot/vmlinuz-*. bootc keeps the kernel and initramfs inside the
# deployment and stages updates as separate deployment roots, so the
# successor is derived from the deployment instead.

# Arming can take a while on emulated hardware: creating the pool moves
# its memory and kexec loads a kernel plus initramfs. The stock unit
# inherits a 45 s start timeout.
TimeoutStartSec=600

ExecStartPre=
ExecStartPre=/usr/libexec/kmorph-bootc arm

ExecStart=
ExecStart=/usr/bin/kmorph watch --config /run/kmorph/mk.conf

ExecStop=
ExecStop=/usr/bin/kmorph disarm --config /run/kmorph/mk.conf
