# Machine keys for the bootc experiment.
#
# kmorph-bootc generates kernel, initrd and cmdline from the bootc
# deployment into /run/kmorph/mk.conf; only keys that are properties of
# this machine belong here.
#
# kernel, cpus and memory are required to arm.

cpus    = 1

# The stripped successor initramfs is ~80 MB; kmorph wants at least 3x
# the image size. With unstripped Fedora modules (~600 MB) use 2GB.
memory  = 1GB

# If the multikernel vsock transport was built as a module instead of
# built in (build-kernel.sh enables it built in), list it so the dracut
# module carries it into the successor image:
#modules = mk_transport

# Optional serial console for the successor.
#
# Not usable on arm64 with this kernel: kmorph adds the PL011 as a
# platform device, and mk_dtb refuses platform devices for an instance
# ("platform devices cannot be given to an instance on arm64"), so arm
# fails with Invalid argument. Leave these unset on arm64 and use SSH.
# On x86 the legacy serial can be handed over:
#console = ttyS0
#console_login = /bin/sh
